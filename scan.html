<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สแกนเปลี่ยนสถานะ | EN-MSU</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
 :root{--nv:#065f46;--gr:#059669;--gr2:#34d399}
 body{font-family:'Sarabun',sans-serif;background:#f0fdf4;color:#0f2e1d}
 .card{background:#fff;border:1px solid #d1fae5;border-radius:16px;box-shadow:0 1px 3px rgba(5,150,105,.08)}
 .navy{background:linear-gradient(120deg,var(--nv),var(--gr))}
 .btn{border-radius:10px;padding:.7rem 1rem;font-size:.9rem;font-weight:600;transition:.15s;width:100%}
 .btn-primary{background:var(--gr);color:#fff}.btn-primary:hover{background:#047857}
 .btn-primary:disabled{background:#93c5b8;cursor:not-allowed}
 .btn-ghost{background:#fff;border:1px solid #a7f3d0;color:#065f46}.btn-ghost:hover{background:#f0fdf4}
 .btn-danger{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3}.btn-danger:hover{background:#ffe4e6}
 .btn-warn{background:#fffbeb;color:#b45309;border:1px solid #fde68a}.btn-warn:hover{background:#fef3c7}
 .btn-skip{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}.btn-skip:hover{background:#e2e8f0}
 input,select{border:1px solid #a7f3d0;border-radius:10px;padding:.6rem .75rem;font-size:.9rem;width:100%}
 input:focus{outline:2px solid var(--gr);outline-offset:1px;border-color:var(--gr)}
 label{font-size:.8rem;color:#475569;font-weight:500;display:block;margin-bottom:.25rem}
 .hidden{display:none!important}
 .heading{background:linear-gradient(90deg,var(--nv),var(--gr) 60%,#84cc16);-webkit-background-clip:text;background-clip:text;color:transparent}
 #reader{width:100%;border-radius:14px;overflow:hidden;background:#000}
 #reader video{border-radius:14px}
 .stage-row{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid #ecfdf5}
 .stage-row:last-child{border-bottom:none}
 .stage-dot{width:2rem;height:2rem;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
 .badge{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:.15rem .55rem}
</style>
</head>
<body>

<!-- ══════════ เข้าสู่ระบบ ══════════ -->
<div id="loginView" class="min-h-screen flex items-center justify-center px-4">
 <div class="card w-full max-w-sm p-7">
  <div class="flex flex-col items-center mb-6">
   <div class="w-14 h-14 rounded-2xl navy text-white flex items-center justify-center text-2xl shadow mb-3">📷</div>
   <div class="font-bold text-lg text-center heading">ระบบกำกับติดตามหนังสือ</div>
   <div class="text-xs text-slate-500 text-center mt-0.5">สแกน QR เปลี่ยนสถานะ · EN-MSU</div>
  </div>
  <div id="setupWarn" class="hidden bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg px-3 py-2 mb-4">
   ⚠️ ยังไม่ได้ตั้งค่า API_URL ในไฟล์นี้ — เปิดไฟล์แก้บรรทัด <code>const API_URL</code> ด้านล่างสุดของโค้ดก่อน โดยใส่ลิงก์ .../exec ของ Apps Script ที่ deploy ไว้
  </div>
  <div id="loginError" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-lg px-3 py-2 mb-4"></div>
  <form id="loginForm" onsubmit="return doLogin(event)">
   <div class="mb-3"><label>ชื่อผู้ใช้</label><input id="loginUser" required autocomplete="username"></div>
   <div class="mb-5"><label>รหัสผ่าน</label><input id="loginPass" type="password" required autocomplete="current-password"></div>
   <button type="submit" id="loginBtn" class="btn btn-primary">เข้าสู่ระบบ</button>
  </form>
 </div>
</div>

<!-- ══════════ หน้าสแกน ══════════ -->
<div id="scanView" class="hidden min-h-screen pb-10">
 <header class="sticky top-0 z-30 navy text-white">
  <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between gap-3">
   <div class="flex items-center gap-2">
    <div class="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center text-lg">📷</div>
    <div><div class="font-bold text-sm leading-tight">สแกนเปลี่ยนสถานะ</div>
     <div class="text-[11px] text-white/80 leading-tight" id="meLabel"></div></div>
   </div>
   <button onclick="doLogout()" class="text-xs bg-white/10 hover:bg-white/20 rounded-lg px-3 py-1.5">ออกจากระบบ</button>
  </div>
 </header>

 <main class="max-w-md mx-auto px-4 pt-4">
  <div id="toast" class="hidden mb-4 text-sm rounded-lg px-3 py-2 border"></div>

  <div id="scanBox" class="card p-4 mb-4">
   <div id="reader" class="hidden mb-3"></div>
   <div id="camIdle" class="text-center py-6">
    <div class="text-5xl mb-2">🔳</div>
    <div class="text-sm text-slate-500 mb-4">กดปุ่มด้านล่างเพื่อเปิดกล้องสแกน QR</div>
   </div>
   <button id="camBtn" onclick="toggleScanner()" class="btn btn-primary">เปิดกล้องสแกน</button>
   <div id="camError" class="hidden mt-3 text-xs bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2"></div>
  </div>

  <div class="card p-4 mb-4">
   <label>หรือกรอกหมายเลขหนังสือเอง (เลขที่รับ หรือเลขหนังสือออก)</label>
   <div class="flex gap-2">
    <input id="manualNo" placeholder="เช่น 18/2569 หรือ อว 0605.14/012" onkeydown="if(event.key==='Enter'){event.preventDefault();manualLookup();}">
    <button onclick="manualLookup()" class="btn btn-ghost" style="width:auto;white-space:nowrap">ค้นหา</button>
   </div>
  </div>

  <div id="resultBox" class="hidden"></div>
 </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ★★★ ตั้งค่าจุดเดียว — ใส่ลิงก์ Web App (.../exec) ของ Apps Script ที่ deploy ไว้
   หาได้จาก: Apps Script Editor -> Deploy -> Manage deployments -> คัดลอก Web app URL
   ═══════════════════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/a/macros/msu.ac.th/s/AKfycbyVaUiUTEfN_jTJWQ0zUxlVqqfMmLDw4MVu530_8UAitgyQQiC0ptqq2mKgUkWBc_0T/exec';

/* เรียก API ของ Apps Script ผ่าน fetch — ใช้ text/plain เพื่อเลี่ยง CORS preflight
   (Apps Script ไม่รองรับ preflight OPTIONS เอง ถ้าใช้ Content-Type: application/json ตรงๆ จะพัง) */
function callApi(action, params){
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, params || {}))
  }).then(r => r.json());
}

let TOKEN = sessionStorage.getItem('dt_scan_token') || '';
let ME = sessionStorage.getItem('dt_scan_displayName') || '';
let ALL_STAGES = [], MY_STAGES = [];
let html5QrCode = null, scanning = false, currentDoc = null;

if (API_URL.indexOf('script.google.com') === -1) document.getElementById('setupWarn').classList.remove('hidden');
if (TOKEN) { boot(); } else { showLogin(); }
function showLogin(){ document.getElementById('loginView').classList.remove('hidden'); document.getElementById('scanView').classList.add('hidden'); }

function doLogin(ev){
  ev.preventDefault();
  const btn = document.getElementById('loginBtn'), err = document.getElementById('loginError');
  err.classList.add('hidden'); btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  callApi('login', { username: username, password: password }).then(res=>{
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    if (!res.ok) { err.textContent = res.message; err.classList.remove('hidden'); return; }
    TOKEN = res.token; ME = res.displayName;
    sessionStorage.setItem('dt_scan_token', TOKEN); sessionStorage.setItem('dt_scan_displayName', ME);
    boot();
  }).catch(e=>{
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    err.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: ' + (e.message || e) + ' — ตรวจสอบว่าใส่ API_URL ถูกต้องและ deploy เป็น "Anyone" แล้ว';
    err.classList.remove('hidden');
  });
  return false;
}
function doLogout(){
  stopScanner(); callApi('logout', { token: TOKEN }).catch(()=>{});
  sessionStorage.removeItem('dt_scan_token'); sessionStorage.removeItem('dt_scan_displayName');
  TOKEN = ''; showLogin();
}
function boot(){
  callApi('getScanBootstrap', { token: TOKEN }).then(res=>{
    if (!res.ok) throw res;
    const cfg = res.data;
    ME = cfg.displayName; MY_STAGES = cfg.myStages; ALL_STAGES = cfg.allStages;
    document.getElementById('meLabel').textContent = ME + (MY_STAGES.length ? '' : ' · ยังไม่ได้กำหนดขั้นตอน');
    document.getElementById('loginView').classList.add('hidden'); document.getElementById('scanView').classList.remove('hidden');
  }).catch(err=>{
    toast((err && err.message) || String(err), false);
    sessionStorage.removeItem('dt_scan_token'); TOKEN=''; showLogin();
  });
}
function toast(msg, ok){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'mb-4 text-sm rounded-lg px-3 py-2 border ' + (ok ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700');
  t.scrollIntoView({behavior:'smooth', block:'nearest'});
  clearTimeout(window._toastT); window._toastT = setTimeout(()=>t.classList.add('hidden'), 4000);
}

/* ══════════ กล้องสแกน ══════════ */
function toggleScanner(){ if (scanning) { stopScanner(); return; } startScanner(); }
function startScanner(){
  const readerEl = document.getElementById('reader'), idleEl = document.getElementById('camIdle');
  const btn = document.getElementById('camBtn'), errEl = document.getElementById('camError');
  errEl.classList.add('hidden');
  if (!window.isSecureContext) {
    errEl.textContent = 'ต้องเปิดหน้านี้ผ่าน https:// เท่านั้นถึงจะใช้กล้องได้';
    errEl.classList.remove('hidden'); return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    errEl.textContent = 'เบราว์เซอร์นี้ไม่รองรับการเข้าถึงกล้อง — ลองเปลี่ยนเป็น Chrome หรือ Safari เวอร์ชันล่าสุด';
    errEl.classList.remove('hidden'); return;
  }
  btn.disabled = true; btn.textContent = 'กำลังขอสิทธิ์กล้อง…';
  html5QrCode = new Html5Qrcode('reader');
  Html5Qrcode.getCameras().then(cams=>{
    btn.disabled = false;
    if (!cams || !cams.length) throw new Error('ไม่พบกล้องบนอุปกรณ์นี้');
    const rear = cams.find(c => /back|rear|environment/i.test(c.label || '')) || cams[cams.length - 1];
    readerEl.classList.remove('hidden'); idleEl.classList.add('hidden'); btn.textContent = 'ปิดกล้อง'; scanning = true;
    return html5QrCode.start(rear.id, { fps: 10, qrbox: { width: 240, height: 240 } },
      (decodedText) => { onScanSuccess(decodedText); }, () => {});
  }).catch(e=>{
    scanning = false; btn.disabled = false;
    readerEl.classList.add('hidden'); idleEl.classList.remove('hidden'); btn.textContent = 'เปิดกล้องสแกน';
    const msg = String((e && e.message) || e || '');
    let hint = 'ตรวจสอบว่าอนุญาตให้เว็บนี้ใช้กล้องในเบราว์เซอร์ หรือใช้ช่องกรอกเลขด้านล่างแทน';
    if (/NotAllowedError|Permission denied|dismissed/i.test(msg)) hint = 'คุณเคยปฏิเสธสิทธิ์กล้องไว้ — เปิดการตั้งค่าเว็บไซต์ของเบราว์เซอร์แล้วเปลี่ยนสิทธิ์กล้องเป็น "อนุญาต" แล้วลองใหม่';
    if (/NotFoundError|ไม่พบกล้อง/i.test(msg)) hint = 'ไม่พบกล้องบนอุปกรณ์นี้ — ลองเปิดจากมือถือแทน หรือใช้ช่องกรอกเลขด้านล่าง';
    errEl.textContent = 'เปิดกล้องไม่ได้: ' + msg + ' — ' + hint;
    errEl.classList.remove('hidden');
  });
}
function stopScanner(){
  if (html5QrCode && scanning) html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{});
  scanning = false;
  document.getElementById('reader').classList.add('hidden');
  document.getElementById('camIdle').classList.remove('hidden');
  document.getElementById('camBtn').textContent = 'เปิดกล้องสแกน';
}
function onScanSuccess(decodedText){
  if (!scanning) return;
  scanning = false;
  if (navigator.vibrate) navigator.vibrate(80);
  if (html5QrCode) html5QrCode.pause(true);
  lookup(decodedText, true);
}
function manualLookup(){
  const v = document.getElementById('manualNo').value.trim();
  if (!v) { toast('กรุณากรอกหมายเลขหนังสือ', false); return; }
  lookup(v, false);
}

/* ══════════ ค้นหา / แสดงผล ══════════ */
function lookup(raw, fromCamera){
  const box = document.getElementById('resultBox');
  box.className = '';
  box.innerHTML = '<div class="card p-6 text-center text-slate-500 text-sm">⏳ กำลังค้นหา...</div>';
  callApi('scanLookup', { token: TOKEN, raw: raw }).then(res=>{
    if (!res.ok) throw res;
    currentDoc = res.data; renderResult(currentDoc);
    if (fromCamera) resumeCameraAfterDelay();
  }).catch(err=>{
    box.innerHTML = ''; box.classList.add('hidden');
    toast((err && err.message) || String(err), false);
    if (fromCamera) resumeCameraAfterDelay();
  });
}
function resumeCameraAfterDelay(){
  setTimeout(()=>{ if (html5QrCode && !scanning) { html5QrCode.resume(); scanning = true; } }, 1500);
}
function stageStatus(doc, key){
  if (doc.owners[key]) return doc.owners[key] === 'ไม่ได้ผ่านฝ่ายนี้' ? 'skip' : 'done';
  if (doc.nextStage === key) return 'next';
  return 'wait';
}
function renderResult(doc){
  const box = document.getElementById('resultBox');
  box.classList.remove('hidden');
  const statusColor = {
    'ดำเนินการ': 'bg-blue-50 text-blue-700 border border-blue-200',
    'แก้ไข': 'bg-amber-50 text-amber-700 border border-amber-200',
    'สำเร็จ': 'bg-emerald-50 text-emerald-700 border border-emerald-200',
    'ยกเลิก': 'bg-rose-50 text-rose-700 border border-rose-200'
  }[doc.status] || 'bg-slate-100 text-slate-600 border border-slate-200';

  let stagesHtml = ALL_STAGES.map(s=>{
    const st = stageStatus(doc, s.key);
    const dot = st === 'done' ? '✅' : (st === 'skip' ? '⏭' : s.icon);
    const dotBg = st === 'done' ? 'bg-emerald-100' : (st === 'skip' ? 'bg-slate-200' : (st === 'next' ? 'bg-blue-100' : 'bg-slate-100'));
    const sub = st === 'done' ? '<div class="text-xs text-slate-500">' + escapeHtml(doc.owners[s.key]) + '</div>'
      : st === 'skip' ? '<div class="text-xs text-slate-400 italic">ไม่ได้ผ่านฝ่ายนี้</div>'
      : (st === 'next' ? '<div class="text-xs text-blue-600 font-medium">รอดำเนินการ</div>' : '<div class="text-xs text-slate-400">ยังไม่ถึงคิว</div>');
    return '<div class="stage-row"><div class="stage-dot ' + dotBg + '">' + dot + '</div>'
      + '<div class="flex-1"><div class="text-sm font-medium">' + escapeHtml(s.label) + '</div>' + sub + '</div></div>';
  }).join('');

  let actionsHtml = '';
  if (doc.actionable && doc.actionable.length) {
    actionsHtml += doc.actionable.map(key=>{
      const s = ALL_STAGES.find(x=>x.key===key) || {};
      const label = s.label || key;
      const btnLabel = s.requiresDocNo ? '🔢 ประทับผ่าน — กรอกเลขหนังสือออก' : ('✔ ประทับผ่าน — ' + escapeHtml(label));
      let html = '<button class="btn btn-primary mb-2" onclick="doStamp(\'' + jsEsc(key) + '\',\'PASS\')">' + btnLabel + '</button>';
      if (s.optional) html += '<button class="btn btn-skip mb-2" onclick="doStamp(\'' + jsEsc(key) + '\',\'SKIP\')">⏭ ข้าม (ไม่ต้องผ่านฝ่ายนี้)</button>';
      return html;
    }).join('');
    const firstKey = doc.actionable[0];
    actionsHtml += '<button class="btn btn-warn mb-2" onclick="doStamp(\'' + jsEsc(firstKey) + '\',\'REJECT\')">↩ ตีกลับแก้ไข</button>';
    if (doc.actionable.includes('คณบดี') || MY_STAGES.length === ALL_STAGES.length) {
      const cancelKey = doc.actionable.includes('คณบดี') ? 'คณบดี' : firstKey;
      actionsHtml += '<button class="btn btn-danger" onclick="doStamp(\'' + jsEsc(cancelKey) + '\',\'CANCEL\')">✕ ยกเลิกเรื่อง</button>';
    }
  } else if (doc.blockReason) {
    actionsHtml = '<div class="text-sm text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-center">' + escapeHtml(doc.blockReason) + '</div>';
  }

  box.innerHTML =
    '<div class="card p-4 mb-4">'
      + '<div class="flex items-start justify-between gap-2 mb-1">'
        + '<div class="font-bold text-base leading-snug">' + escapeHtml(doc.no) + '</div>'
        + '<span class="badge ' + statusColor + '">' + escapeHtml(doc.status || '-') + '</span></div>'
      + '<div class="text-sm text-slate-700 mb-3">' + escapeHtml(doc.subject || '-') + '</div>'
      + '<div class="grid grid-cols-2 gap-2 text-xs text-slate-500 mb-1">'
        + '<div>ประเภท: ' + escapeHtml(doc.cat || '-') + '</div>'
        + '<div>วันที่เริ่ม: ' + escapeHtml(doc.startDate || '-') + '</div>'
        + '<div class="col-span-2">ผู้รับเรื่อง: ' + escapeHtml(doc.owner || '-') + (doc.dept ? ' · ' + escapeHtml(doc.dept) : '') + '</div></div></div>'
    + '<div class="card p-4 mb-4">' + stagesHtml + '</div>'
    + '<div class="mb-6">' + actionsHtml + '</div>'
    + '<button class="btn btn-ghost" onclick="clearResult()">สแกนเรื่องถัดไป</button>';
}

function clearResult(){
  currentDoc = null;
  document.getElementById('resultBox').classList.add('hidden');
  document.getElementById('resultBox').innerHTML = '';
  document.getElementById('manualNo').value = '';
  if (html5QrCode && !scanning) { html5QrCode.resume(); scanning = true; }
}

function doStamp(stageKey, action){
  if (!currentDoc) return;
  let note = '', extra = '';
  const stageDef = ALL_STAGES.find(s=>s.key===stageKey) || {};
  if (action === 'PASS' && stageDef.requiresDocNo) {
    extra = window.prompt('กรอกเลขหนังสือออก เช่น อว 0605.14/019', '') || '';
    if (!extra.trim()) { toast('กรุณากรอกเลขหนังสือออก', false); return; }
  }
  if (action === 'REJECT' || action === 'CANCEL') {
    const label = action === 'REJECT' ? 'เหตุผลที่ตีกลับ (ไม่บังคับ)' : 'เหตุผลที่ยกเลิก (ไม่บังคับ)';
    note = window.prompt(label, '') || '';
    const confirmMsg = action === 'REJECT'
      ? 'ยืนยันตีกลับเรื่อง ' + currentDoc.no + ' ให้แก้ไข?'
      : 'ยืนยันยกเลิกเรื่อง ' + currentDoc.no + '? การกระทำนี้ย้อนกลับไม่ได้';
    if (!window.confirm(confirmMsg)) return;
  }
  if (action === 'SKIP' && !window.confirm('ยืนยันว่าเรื่องนี้ "ไม่ได้ผ่านฝ่าย ' + stageKey + '" ใช่หรือไม่?')) return;

  const box = document.getElementById('resultBox');
  box.style.opacity = '0.5'; box.style.pointerEvents = 'none';
  callApi('stampStage', { token: TOKEN, no: currentDoc.no, stageKey: stageKey, stampAction: action, note: note, extra: extra }).then(res=>{
    box.style.opacity = '1'; box.style.pointerEvents = 'auto';
    if (!res.ok) throw res;
    toast(res.message, true); clearResult();
  }).catch(err=>{
    box.style.opacity = '1'; box.style.pointerEvents = 'auto';
    toast((err && err.message) || String(err), false);
  });
}

function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsEsc(s){ return String(s).replace(/'/g, "\\'"); }
</script>
</body>
</html>
