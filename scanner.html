<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>finacc | เครื่องสแกน QR</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
 :root{--nv:#0f2d5c;--bl:#1d4ed8;--ok:#059669;--bad:#e11d48;--warn:#b45309;--line:#e5e9f2}
 *{box-sizing:border-box}
 body{margin:0;font-family:'Sarabun',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#f8fafc;color:#0f172a;-webkit-text-size-adjust:100%}
 header{background:var(--nv);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
        position:sticky;top:0;z-index:10}
 header .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);
            display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
 header b{font-size:15px;display:block;line-height:1.25}
 header span{font-size:11px;opacity:.75}
 main{max-width:440px;margin:0 auto;padding:16px}
 .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;
       box-shadow:0 1px 3px rgba(15,45,92,.05)}
 button{font-family:inherit;font-size:16px;font-weight:600;border:0;border-radius:11px;
        padding:15px 16px;width:100%;display:block;cursor:pointer;transition:.15s}
 .primary{background:var(--bl);color:#fff}.primary:active{background:#1e40af}
 .ghost{background:#fff;border:1px solid #cbd5e1;color:#334155;font-size:14px;padding:11px 14px}
 .ghost:active{background:#f1f5f9}
 .row{display:flex;gap:8px}.row button{flex:1}
 .mt{margin-top:9px}
 #reader{width:100%;border-radius:13px;overflow:hidden;background:#000;display:none;margin-bottom:12px}
 #reader video{width:100%;display:block;border-radius:13px}
 #idle{text-align:center;padding:26px 8px}
 #idle .big{font-size:52px;line-height:1;margin-bottom:10px}
 #idle p{font-size:14px;color:#64748b;margin:0}
 .msg{font-size:13px;line-height:1.75;border-radius:11px;padding:11px 13px;margin-top:11px;display:none}
 .msg.show{display:block}
 .msg.err{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}
 .msg.warn{background:#fffbeb;border:1px solid #fde68a;color:var(--warn)}
 .msg.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
 .raw{opacity:.7;font-size:11.5px;margin-top:7px;word-break:break-all}
 .result{border-left:4px solid var(--ok)}
 .result .lbl{font-size:11px;color:#64748b;letter-spacing:.02em}
 .result .val{font-size:17px;font-weight:700;word-break:break-all;margin:4px 0 12px;line-height:1.45}
 .hist{font-size:12.5px;color:#475569}
 .hist div{padding:7px 0;border-bottom:1px solid #f1f5f9;display:flex;gap:8px}
 .hist div:last-child{border-bottom:0}
 .hist .t{color:#94a3b8;flex-shrink:0}
 .hist .v{word-break:break-all}
 .diag{font-size:11.5px;color:#475569;line-height:1.9}
 .diag i{color:#94a3b8;font-style:normal;display:inline-block;width:46%}
 .link{background:none;border:0;color:#64748b;font-size:12.5px;text-decoration:underline;
       padding:6px;width:auto;margin:0 auto;display:block}
 .foot{text-align:center;font-size:11px;color:#94a3b8;padding:4px 0 24px;line-height:1.7}
</style>
</head>
<body>

<header>
 <div class="ic">📷</div>
 <div><b>finacc — เครื่องสแกน QR</b><span>ฝ่ายการเงินและบัญชี คณะวิศวกรรมศาสตร์ มมส.</span></div>
</header>

<main>
 <div class="card">
  <div id="reader"></div>
  <div id="idle">
   <div class="big">🔳</div>
   <p>กดปุ่มด้านล่างเพื่อเปิดกล้อง<br>แล้วส่องไปที่ QR บนหน้าปกหนังสือ</p>
  </div>

  <button id="mainBtn" class="primary" onclick="toggleCam()">เปิดกล้องสแกน</button>

  <div class="row mt" id="camTools" style="display:none">
   <button class="ghost" onclick="switchCam()" id="swBtn">🔄 สลับกล้อง</button>
   <button class="ghost" onclick="toggleTorch()" id="torchBtn">🔦 ไฟฉาย</button>
  </div>

  <div id="msg" class="msg"></div>
 </div>

 <div id="resultCard" class="card result" style="display:none">
  <div class="lbl">ผลการสแกนล่าสุด</div>
  <div class="val" id="resultVal"></div>
  <div class="row">
   <button class="ghost" onclick="openResult()" id="openBtn">↗ เปิดลิงก์</button>
   <button class="ghost" onclick="copyResult()">📋 คัดลอก</button>
  </div>
  <button class="ghost mt" onclick="clearResult()">สแกนรายการถัดไป</button>
 </div>

 <div id="histCard" class="card" style="display:none">
  <div class="lbl" style="font-size:11px;color:#64748b;margin-bottom:6px">ประวัติการสแกนในหน้านี้</div>
  <div class="hist" id="hist"></div>
 </div>

 <button class="link" onclick="toggleDiag()">🔍 ตรวจสภาพเครื่องและกล้อง</button>
 <div id="diagCard" class="card diag" style="display:none"></div>

 <div class="foot">
  หน้านี้ทำงานบนเว็บของคณะโดยตรง จึงเปิดกล้องได้ทุกเบราว์เซอร์<br>
  ข้อมูลที่สแกนประมวลผลในเครื่องของคุณ ไม่ได้ส่งออกไปที่ใด
 </div>
</main>

<script>
/* ==========================================================================
   finacc — เครื่องสแกน QR (ไฟล์เดี่ยว ไม่ต้องพึ่ง Apps Script)
   --------------------------------------------------------------------------
   วางไฟล์นี้ไว้บนเว็บของคณะ (เช่น GitHub Pages) ข้างๆ index.html
   เปิดผ่าน https แล้วกล้องจะทำงานได้ทั้ง iPhone และ Android

   เหตุผลที่ต้องแยกออกมา: หน้าเว็บที่เสิร์ฟจาก Apps Script จะถูกวางไว้ใน
   กรอบซ้อนข้ามโดเมนซึ่งไม่ได้เปิดสิทธิ์กล้องไว้ Chrome กับ Safari จึงปฏิเสธ
   ทันที ส่วนหน้านี้เป็นหน้าระดับบนสุดของโดเมนคุณเอง ข้อจำกัดนั้นจึงไม่มีผล
   ========================================================================== */

/* แหล่งดาวน์โหลดไลบรารีอ่าน QR — ไล่ลองทีละที่จนกว่าจะโหลดได้ */
const LIB_SOURCES = [
  'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js',
  'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
  'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'
];

const $ = id => document.getElementById(id);
let qr = null;               // ตัวอ่าน QR
let running = false;
let cameras = [];            // รายชื่อกล้องในเครื่อง
let camIndex = 0;
let torchOn = false;
let lastText = '';
const history = [];

/* ---------- ข้อความแจ้งสถานะ ---------- */
function say(html, kind){
  const m = $('msg');
  m.className = 'msg show ' + (kind || 'warn');
  m.innerHTML = html;
}
function hideMsg(){ $('msg').className = 'msg'; }

/* ---------- โหลดไลบรารีแบบมีทางสำรอง ---------- */
function loadLib(){
  if (window.Html5Qrcode) return Promise.resolve();
  let chain = Promise.reject();
  LIB_SOURCES.forEach(src => {
    chain = chain.catch(() => new Promise((ok, no) => {
      const el = document.createElement('script');
      el.src = src;
      el.onload = () => window.Html5Qrcode ? ok() : no(new Error('โหลดแล้วแต่ใช้ไม่ได้'));
      el.onerror = () => no(new Error('โหลดไม่สำเร็จจาก ' + src));
      document.head.appendChild(el);
    }));
  });
  return chain;
}

/* ขอสิทธิ์กล้องแบบตรงไปตรงมาหนึ่งครั้ง แล้วปิดสตรีมทิ้งทันที
   คืน true ถ้าได้สิทธิ์ หรือคืนตัว error ถ้าไม่ได้ */
async function askPermission(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return new Error('เบราว์เซอร์นี้ไม่รองรับการใช้กล้อง');
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (e) {
    // บางเครื่องไม่รู้จัก facingMode ลองขอกล้องแบบไม่ระบุอีกครั้ง
    try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
    catch (e2) { return e; }
  }
  try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  // เว้นจังหวะให้ระบบปล่อยกล้องคืนก่อน มิฉะนั้นบางเครื่องจะขึ้นว่ากล้องถูกใช้งานอยู่
  await new Promise(r => setTimeout(r, 180));
  return true;
}

/* คืนปุ่มให้กดใหม่ได้ */
function resetBtn(){
  const btn = $('mainBtn');
  btn.disabled = false;
  btn.className = 'primary';
  btn.textContent = 'เปิดกล้องสแกน';
  $('reader').style.display = 'none';
  $('idle').style.display = 'block';
}

/* บังคับให้วิดีโอเล่นจริง — Safari บนมือถือบางครั้งไม่เริ่มเล่นเองรอบแรก */
function kickVideo(tries){
  const v = document.querySelector('#reader video');
  if (!v) { if (tries > 0) setTimeout(() => kickVideo(tries - 1), 200); return; }
  v.setAttribute('playsinline', '');
  v.setAttribute('autoplay', '');
  v.muted = true;
  const p = v.play();
  if (p && p.catch) p.catch(() => { if (tries > 0) setTimeout(() => kickVideo(tries - 1), 250); });
}

/* กันเหนียว: ถ้าเปิดแล้วยังไม่มีภาพจริงภายในเวลาที่กำหนด ให้เปิดใหม่ให้เองหนึ่งครั้ง */
let autoRetried = false;
function watchFirstFrame(){
  setTimeout(async () => {
    if (!running) return;
    const v = document.querySelector('#reader video');
    if (v && v.videoWidth > 0) return;          // มีภาพแล้ว เรียบร้อย
    kickVideo(4);
    setTimeout(async () => {
      if (!running) return;
      const v2 = document.querySelector('#reader video');
      if (v2 && v2.videoWidth > 0) return;
      if (autoRetried) {
        say('ภาพจากกล้องยังไม่ขึ้น ลองกดปิดกล้องแล้วเปิดใหม่อีกครั้ง', 'warn');
        return;
      }
      autoRetried = true;
      await stopCam();
      await new Promise(r => setTimeout(r, 250));
      startCam();
    }, 1400);
  }, 1200);
}

/* ---------- เปิด/ปิดกล้อง ---------- */
function toggleCam(){ if (running) { autoRetried = true; stopCam(); } else { autoRetried = false; startCam(); } }

async function startCam(){
  hideMsg();
  const btn = $('mainBtn');
  btn.textContent = 'กำลังเปิดกล้อง…';
  btn.disabled = true;

  // ต้องเปิดผ่าน https เท่านั้น (ยกเว้นทดสอบบนเครื่องตัวเองที่ localhost)
  if (!window.isSecureContext) {
    resetBtn();
    say('<b>หน้านี้ไม่ได้เปิดผ่าน https</b><br>เบราว์เซอร์ห้ามใช้กล้องกับหน้าที่ไม่ปลอดภัย '
      + 'ให้เปิดผ่านลิงก์เว็บของคณะที่ขึ้นต้นด้วย https:// ไม่ใช่เปิดไฟล์จากเครื่องโดยตรง', 'err');
    return;
  }

  // ★ ขอสิทธิ์กล้องให้จบเป็นขั้นตอนแรกก่อนเสมอ
  // บนมือถือ กล่องขออนุญาตจะค้างรอผู้ใช้กดอยู่ ระหว่างนั้นตัวอ่าน QR จะวัดขนาดภาพไม่ได้
  // ทำให้กดครั้งแรกแล้วจอดำ ต้องปิดแล้วเปิดใหม่ถึงติด การขอสิทธิ์แยกออกมาก่อนจึงตัดปัญหานี้ทิ้ง
  const permit = await askPermission();
  if (permit !== true) {
    resetBtn();
    say(explain(permit), 'err');
    return;
  }

  try { await loadLib(); }
  catch (e) {
    resetBtn();
    say('<b>โหลดตัวอ่าน QR ไม่สำเร็จ</b><br>ตรวจสอบว่าเครื่องต่ออินเทอร์เน็ตอยู่ แล้วรีเฟรชหน้านี้ใหม่', 'err');
    return;
  }

  $('reader').style.display = 'block';
  $('idle').style.display = 'none';
  qr = new Html5Qrcode('reader', { verbose: false });

  const config = {
    fps: 12,
    qrbox: v => { const s = Math.floor(Math.min(v.width, v.height) * 0.72); return { width: s, height: s }; },
    aspectRatio: 1.0
  };

  // ไล่ลองหลายวิธีเปิดกล้อง เพราะแต่ละเครื่องรับคำสั่งไม่เหมือนกัน
  const attempts = [
    { facingMode: 'environment' },
    { facingMode: { exact: 'environment' } },
    { facingMode: 'user' }
  ];
  const errors = [];

  for (const target of attempts) {
    try {
      await qr.start(target, config, onFound, () => {});
      return afterStart();
    } catch (e) { errors.push(e); }
  }

  // วิธีสุดท้าย: ขอรายชื่อกล้องแล้วเลือกเอง
  try {
    cameras = await Html5Qrcode.getCameras();
    if (cameras && cameras.length) {
      const back = cameras.findIndex(c => /back|rear|environment|หลัง/i.test(c.label || ''));
      camIndex = back >= 0 ? back : cameras.length - 1;
      await qr.start(cameras[camIndex].id, config, onFound, () => {});
      return afterStart();
    }
    errors.push(new Error('ไม่พบกล้องในเครื่องนี้'));
  } catch (e) { errors.push(e); }

  // เปิดไม่ได้เลย
  resetBtn();
  say(explain(pickClearest(errors)), 'err');
}

async function afterStart(){
  running = true;
  const btn = $('mainBtn');
  btn.disabled = false;
  btn.textContent = '■ ปิดกล้อง';
  btn.className = 'ghost';
  btn.style.fontSize = '16px';
  btn.style.padding = '15px 16px';
  $('camTools').style.display = 'flex';

  // รายชื่อกล้อง ใช้ตอนกดสลับ
  if (!cameras.length) {
    try { cameras = await Html5Qrcode.getCameras(); } catch (e) { cameras = []; }
  }
  $('swBtn').style.display = (cameras.length > 1) ? 'block' : 'none';
  $('torchBtn').style.display = hasTorch() ? 'block' : 'none';

  kickVideo(6);        // บังคับให้ภาพเริ่มเล่นทันที
  watchFirstFrame();   // ถ้ายังไม่ขึ้นภาพจริง จะเปิดใหม่ให้เอง
}

async function stopCam(){
  if (qr && running) { try { await qr.stop(); await qr.clear(); } catch (e) {} }
  running = false; torchOn = false;
  $('reader').style.display = 'none';
  $('idle').style.display = 'block';
  $('camTools').style.display = 'none';
  const btn = $('mainBtn');
  btn.className = 'primary';
  btn.textContent = 'เปิดกล้องสแกน';
  btn.disabled = false;
}

/* ---------- สลับกล้องหน้า/หลัง ---------- */
async function switchCam(){
  if (!cameras.length || cameras.length < 2 || !running) return;
  camIndex = (camIndex + 1) % cameras.length;
  try {
    await qr.stop();
    await qr.start(cameras[camIndex].id,
      { fps: 12, qrbox: v => { const s = Math.floor(Math.min(v.width, v.height) * 0.72); return { width: s, height: s }; } },
      onFound, () => {});
    torchOn = false;
    $('torchBtn').style.display = hasTorch() ? 'block' : 'none';
  } catch (e) { say('สลับกล้องไม่สำเร็จ: ' + (e.message || e), 'warn'); }
}

/* ---------- ไฟฉาย (บางเครื่องเท่านั้น) ---------- */
function hasTorch(){
  try {
    const cap = qr && qr.getRunningTrackCapabilities ? qr.getRunningTrackCapabilities() : null;
    return !!(cap && cap.torch);
  } catch (e) { return false; }
}
async function toggleTorch(){
  if (!running) return;
  torchOn = !torchOn;
  try {
    await qr.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
    $('torchBtn').textContent = torchOn ? '🔦 ปิดไฟฉาย' : '🔦 ไฟฉาย';
  } catch (e) {
    torchOn = false;
    say('เครื่องนี้เปิดไฟฉายจากหน้าเว็บไม่ได้', 'warn');
  }
}

/* ---------- อ่าน QR ได้ ---------- */
function onFound(text){
  if (!running || text === lastText) return;
  lastText = text;
  if (navigator.vibrate) navigator.vibrate(90);
  beep();

  $('resultVal').textContent = text;
  $('resultCard').style.display = 'block';
  $('openBtn').style.display = /^https?:\/\//i.test(text) ? 'block' : 'none';

  const time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  history.unshift({ time, text });
  renderHistory();

  $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // หยุดชั่วครู่กันอ่านซ้ำรัว ๆ แล้วสแกนต่อได้เอง
  try { qr.pause(true); } catch (e) {}
  setTimeout(() => { try { if (running) qr.resume(); } catch (e) {} lastText = ''; }, 2200);
}

function renderHistory(){
  if (!history.length) return;
  $('histCard').style.display = 'block';
  $('hist').innerHTML = history.slice(0, 12)
    .map(h => '<div><span class="t">' + h.time + '</span><span class="v">' + esc(h.text) + '</span></div>').join('');
}

function openResult(){
  const t = $('resultVal').textContent;
  if (/^https?:\/\//i.test(t)) window.open(t, '_blank', 'noopener');
}
function copyResult(){
  const t = $('resultVal').textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => say('คัดลอกแล้ว', 'ok')).catch(() => prompt('คัดลอกข้อความนี้', t));
  } else prompt('คัดลอกข้อความนี้', t);
}
function clearResult(){
  $('resultCard').style.display = 'none';
  lastText = '';
  hideMsg();
  if (running) { try { qr.resume(); } catch (e) {} }
}

/* เสียงปี๊บสั้น ๆ ตอนอ่านสำเร็จ (ไม่ต้องโหลดไฟล์เสียง) */
function beep(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; gain.gain.value = 0.08;
    osc.start(); osc.stop(ctx.currentTime + 0.12);
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 400);
  } catch (e) {}
}

/* ---------- แปลง error เป็นคำอธิบายที่ทำตามได้ ---------- */
function rank(e){
  const n = (e && e.name) || '', r = (e && e.message) || '';
  if (/Permissions policy|not allowed in this document/i.test(r)) return 5;
  if (n === 'NotAllowedError' || n === 'SecurityError') return 4;
  if (n === 'NotReadableError' || n === 'TrackStartError') return 3;
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 2;
  return 1;
}
function pickClearest(list){
  let best = list[0];
  for (let i = 1; i < list.length; i++) if (rank(list[i]) > rank(best)) best = list[i];
  return best;
}
function explain(e){
  const name = (e && e.name) || '';
  const raw = (e && e.message) || String(e || '');
  const detail = '<div class="raw">รายละเอียดจากเบราว์เซอร์: ' + esc((name ? name + ' — ' : '') + raw) + '</div>';
  let msg;

  if (name === 'NotAllowedError' || /denied|permission/i.test(raw)) {
    msg = '<b>ยังไม่ได้อนุญาตให้เว็บนี้ใช้กล้อง</b><br>'
        + '<b>iPhone (Safari):</b> แตะ <b>อา</b> ทางซ้ายของช่องที่อยู่เว็บ → การตั้งค่าเว็บไซต์ → กล้อง → อนุญาต<br>'
        + '<b>Android (Chrome):</b> แตะไอคอน 🔒 ข้างช่องที่อยู่เว็บ → สิทธิ์ → กล้อง → อนุญาต<br>'
        + 'แล้วรีเฟรชหน้านี้และกดเปิดกล้องอีกครั้ง';
  } else if (name === 'NotFoundError' || name === 'OverconstrainedError' || /ไม่พบกล้อง/.test(raw)) {
    msg = '<b>ไม่พบกล้องที่ใช้งานได้</b><br>ลองเครื่องที่มีกล้องหลัง หรือกดสลับกล้องหลังเปิดสำเร็จ';
  } else if (name === 'NotReadableError' || name === 'TrackStartError') {
    msg = '<b>กล้องถูกแอปอื่นใช้อยู่</b><br>ปิดแอปกล้อง แอปวิดีโอคอล หรือแท็บอื่นที่เปิดกล้องค้างไว้ แล้วลองใหม่';
  } else if (name === 'SecurityError') {
    msg = '<b>หน้าเว็บไม่ปลอดภัยพอสำหรับใช้กล้อง</b><br>ต้องเปิดผ่าน https:// เท่านั้น';
  } else {
    msg = '<b>เปิดกล้องไม่สำเร็จ</b><br>ลองรีเฟรชหน้านี้ หรือกดตรวจสภาพเครื่องด้านล่างเพื่อดูรายละเอียด';
  }
  return msg + detail;
}

/* ---------- ตรวจสภาพเครื่อง ---------- */
async function toggleDiag(){
  const box = $('diagCard');
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = 'กำลังตรวจ…';

  const rows = [];
  const add = (k, v) => rows.push([k, v]);
  let framed; try { framed = (window.self !== window.top); } catch (e) { framed = true; }

  add('ที่อยู่ของหน้า', location.origin);
  add('อยู่ในกรอบซ้อน', framed ? 'ใช่ (ไม่ควรเป็นแบบนี้)' : 'ไม่');
  add('เชื่อมต่อแบบ https', window.isSecureContext ? 'ใช่' : 'ไม่');
  add('เบราว์เซอร์รองรับกล้อง', (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? 'ใช่' : 'ไม่');
  try {
    const fp = document.featurePolicy || document.permissionsPolicy;
    add('นโยบายอนุญาตกล้อง', fp && fp.allowsFeature ? (fp.allowsFeature('camera') ? 'อนุญาต' : 'ไม่อนุญาต') : 'ตรวจไม่ได้');
  } catch (e) { add('นโยบายอนุญาตกล้อง', 'ตรวจไม่ได้'); }
  try {
    if (navigator.permissions && navigator.permissions.query) {
      const st = await navigator.permissions.query({ name: 'camera' });
      add('สถานะสิทธิ์กล้อง', st.state);
    } else add('สถานะสิทธิ์กล้อง', 'ตรวจไม่ได้');
  } catch (e) { add('สถานะสิทธิ์กล้อง', 'ตรวจไม่ได้'); }
  add('ตัวอ่าน QR', window.Html5Qrcode ? 'โหลดแล้ว' : 'ยังไม่ได้โหลด');
  try {
    if (window.Html5Qrcode) {
      const cams = await Html5Qrcode.getCameras();
      add('จำนวนกล้องที่พบ', (cams && cams.length) || 0);
    }
  } catch (e) { add('จำนวนกล้องที่พบ', 'ตรวจไม่ได้'); }

  box.innerHTML = rows.map(r => '<div><i>' + esc(r[0]) + '</i>' + esc(String(r[1])) + '</div>').join('');
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
